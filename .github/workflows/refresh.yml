name: Refresh screener

on:
  schedule:
    # 21:30 UTC on weekdays — 17:30 ET during EDT, 16:30 ET during EST, so it
    # always lands after the 16:00 ET close. Cron here is always UTC.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:            # lets you trigger a run by hand from the UI

permissions:
  contents: write               # needed to commit the refreshed data file

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Without this, Python buffers stdout when it isn't a TTY and the run
      # log stays empty until the job finishes.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build opportunity feed
        run: python -m engine.build

      - name: Validate output
        # A failed job is visible; a published page full of nonsense is not.
        # Nothing gets committed unless the file passes.
        run: python scripts/validate.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/data data/cache
          if git diff --staged --quiet; then
            echo "No change in output — nothing to commit."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Summary
        if: always()
        run: python scripts/summary.py
